# Job "test": runs the full SwiftPM test suite on a macOS runner for every
# push and pull request.
#
# Generated-note tests read SIDEKICK_FUZZ_SEEDS (and _STEPS, _BUDGET); this workflow leaves them at their defaults.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test
